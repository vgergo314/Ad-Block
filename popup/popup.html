<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Popup Guard</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <svg class="logo" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9.5" fill="#fff" stroke="#d93a2b" stroke-width="2.5"/><path d="M5.5 5.5l13 13" stroke="#d93a2b" stroke-width="2.5"/></svg>
    <h1>Popup Guard</h1>
    <button type="button" class="count-chip" id="stats-toggle" aria-haspopup="menu" aria-expanded="false" aria-controls="stats">
      <span id="total-chip">0</span>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <button type="button" class="switch master" id="enabled" role="switch" aria-checked="true" aria-label="Popup Guard on or off"><span></span></button>
  </header>

  <!-- Drops down from the count chip over the rest of the popup. -->
  <div class="scrim" id="scrim" hidden></div>
  <div class="menu" id="stats" role="menu" aria-label="Blocked popups" hidden>
    <div class="menu-title" id="st-title"></div>
    <ul id="st-sites"></ul>
    <div class="menu-sep"></div>
    <button type="button" role="menuitem" class="menu-item" id="st-reset">Reset count</button>
  </div>

  <main id="settings">
    <section class="site" id="current" aria-label="This site">
      <div class="site-row">
        <span class="host" id="host">—</span>
        <button type="button" class="switch" id="toggle" role="switch" aria-checked="false" aria-label="Block popups on this site"><span></span></button>
      </div>
      <div class="status">
        <span id="status"></span>
        <span id="stat" hidden><span class="dot" aria-hidden="true">·</span> <b id="count">0</b> <span id="count-word">popups</span> blocked in this tab</span>
      </div>
      <div><button type="button" class="link" id="allow" hidden>Let the next popup through</button></div>

      <div class="note" id="reload-hint" hidden>
        <p>This tab was open before Popup Guard started, so popups can still slip through. Reload it to start blocking.</p>
        <div class="note-actions"><button type="button" class="primary" id="reload-tab">Reload tab</button></div>
      </div>

      <div class="note" id="suggest" hidden>
        <p id="suggest-text"></p>
        <div class="note-actions">
          <button type="button" class="primary" id="suggest-protect">Protect</button>
          <button type="button" class="ghost" id="suggest-dismiss">Not this site</button>
        </div>
      </div>
    </section>

    <section class="sites" aria-labelledby="sites-title">
      <div class="sites-head">
        <span class="section-title" id="sites-title">Sites</span>
        <span class="sites-hint">click a rule to switch it</span>
      </div>
      <ul class="site-list" id="sites"></ul>
      <form id="add-form">
        <label class="sr-only" for="add-input">Site to add</label>
        <input id="add-input" type="text" placeholder="example.com" autocomplete="off" spellcheck="false">
        <label class="sr-only" for="add-mode">Rule</label>
        <select id="add-mode">
          <option value="block">Block</option>
          <option value="allow">Allow</option>
        </select>
        <button type="submit" class="primary">Add</button>
      </form>
      <div class="error" id="add-error" role="alert" hidden></div>
    </section>
  </main>

  <footer>
    <span id="badge-label">Show count on icon</span>
    <button type="button" class="switch small" id="badge-count" role="switch" aria-checked="false" aria-labelledby="badge-label"><span></span></button>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
